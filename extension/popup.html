<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ContextDock</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon"></div>
      <span>ContextDock</span>
    </div>
    <div class="header-actions">
      <button id="copyJsonBtn" class="btn-primary">Copy JSON</button>
    </div>
  </div>

  <div class="recovery-note">
    To restore a session, click <strong>Copy JSON</strong>, then paste it into the import box on the
    <strong>ContextDock website</strong>.
  </div>

  <div class="section">
    <div class="section-title">Current Window</div>
    <div id="autoSaveStatus" class="auto-save-status"></div>
    <div id="currentTabs" class="tab-list"></div>
  </div>

  <div class="section">
    <input id="wsName" type="text" placeholder="Workspace Name (e.g. Client Pitch)" />
    <input id="wsPurpose" type="text" placeholder="Purpose (e.g. Researching)" />
    <button id="saveNamedBtn" class="btn-primary">Save as Named Workspace</button>
  </div>

  <div class="section">
    <div class="section-title">Recent Auto-Saves</div>
    <div id="autoSaves" class="session-list"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
